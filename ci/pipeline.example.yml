# GitHub Actions target-repository example — docs/06-operations.md §1
#
# This workflow is not a self-test for the Markdown guide. Copy it only when a
# target code repository needs these checks, then configure the repository
# variables below:
#   FAST_LANE_COMMAND   required: lint/build/selected checks
#   MERGE_LANE_COMMAND  required: combined-state verification
#   NIGHTLY_COMMAND     optional: trend-only checks
#
# Pull requests and merge groups use the same required job names. This matters
# when GitHub's merge queue evaluates the synthetic combined commit.
#
# SECURITY BOUNDARY:
# Hidden tests belong in an independent required status check produced by a
# trusted, isolated black-box evaluator. Do not clone hidden tests or expose an
# evaluator token in a runner that checks out or executes PR-controlled code.

name: target-repo-reference

on:
  push:
    branches:
      - "agent/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  target-fast-lane:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # Pinned immutable release: actions/checkout v6.0.1.
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify adapter configuration
        env:
          FAST_LANE_COMMAND: ${{ vars.FAST_LANE_COMMAND }}
        run: |
          if [[ -z "${FAST_LANE_COMMAND:-}" ]]; then
            echo "Configure FAST_LANE_COMMAND before enabling this workflow." >&2
            exit 2
          fi

      - name: Run target-repository fast lane
        env:
          FAST_LANE_COMMAND: ${{ vars.FAST_LANE_COMMAND }}
        run: bash -euo pipefail -c "$FAST_LANE_COMMAND"

  target-merge-suite:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'merge_group'
    needs:
      - target-fast-lane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify adapter configuration
        env:
          MERGE_LANE_COMMAND: ${{ vars.MERGE_LANE_COMMAND }}
        run: |
          if [[ -z "${MERGE_LANE_COMMAND:-}" ]]; then
            echo "Configure MERGE_LANE_COMMAND before enabling this workflow." >&2
            exit 2
          fi

      - name: Verify the combined state
        env:
          MERGE_LANE_COMMAND: ${{ vars.MERGE_LANE_COMMAND }}
        run: bash -euo pipefail -c "$MERGE_LANE_COMMAND"

  nightly:
    if: >-
      github.event_name == 'schedule' &&
      vars.NIGHTLY_COMMAND != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run trend checks
        env:
          NIGHTLY_COMMAND: ${{ vars.NIGHTLY_COMMAND }}
        run: bash -euo pipefail -c "$NIGHTLY_COMMAND"

# Suggested required checks for `main` after adapting this example:
#   - target-fast-lane
#   - target-merge-suite
#   - hidden-evaluator  (external; only if the threat model requires it)
#
# A generic "any non-zero exit is red" result is not evidence of an expected
# failing test: syntax, import, and infrastructure failures are also non-zero.
# If a target repository adopts red-proof verification, its adapter should
# verify the expected test identity and assertion failure class.
