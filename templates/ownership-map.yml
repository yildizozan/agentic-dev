# Yazma sahipliği haritası — docs/03-concurrency.md §1
#
# Kural: Herhangi bir anda, herhangi bir path'in EN FAZLA BİR yazma sahibi vardır.
#
# Bu dosya üç yerde birlikte uygulanır — üçünü de kur:
#   1. CODEOWNERS        → review zorunluluğu   (yazmayı ENGELLEMEZ)
#   2. pre-commit hook   → yazma reddi          (lokal, hızlı geri bildirim)
#   3. CI gate           → yazma reddi          (atlanamaz)
#
# Sahibi: agent:techlead. Feature ajanları bu dosyayı DEĞİŞTİREMEZ (docs/06 §5.1).

version: 1

# risk: high  → docs/05 §3.3'e göre 🔴 zorunlu insan review'ü tetikler
domains:
  # --- spec ve testler: kod ajanına kapalı (docs/02 §4.1, §4.2) ---
  - path: "specs/acceptance-criteria/**"
    owner: agent:pm
    approvers: [human]            # approved alanını yalnız insan doldurur
  - path: "tests/acceptance/**"
    owner: agent:qa
  - path: "tests/regression/**"
    owner: agent:qa
  - path: "tests/hidden/**"
    owner: agent:qa
    visibility: hidden            # feature ajanı okuyamaz, CI log'u sızdırmaz
  - path: "contracts/**"
    owner: agent:techlead
    risk: high                    # breaking change → G3

  # --- yüksek çekişmeli tek-sahipli yüzeyler (docs/03 §6) ---
  - path: "db/migrations/**"
    owner: agent:migration
    risk: high
    rule: "timestamp/ULID isimlendirme; daima kendi PR'ında; geri alınabilir"
  - path: "**/package-lock.json"
    owner: agent:deps
    rule: "feature PR'ında commit edilmez; merge queue'da yeniden üretilir"
  - path: "**/pubspec.lock"
    owner: agent:deps
  - path: "**/Podfile.lock"
    owner: agent:deps
  - path: "generated/**"
    owner: agent:ci
    rule: "commit edilmez; dondurulmuş contract'tan CI üretir"

  # --- kural ve konfigürasyon: ajan kendi kısıtını yazamaz (docs/05 §5) ---
  - path: ".github/workflows/**"
    owner: agent:techlead
    risk: high
  - path: "CODEOWNERS"
    owner: agent:techlead
    risk: high
  - path: "templates/ownership-map.yml"
    owner: agent:techlead
    risk: high
  - path: "AGENTS.md"
    owner: agent:techlead
    risk: high
  - path: ".claude/**"
    owner: agent:techlead
    risk: high

  # --- feature domainleri: dikey dilimler (docs/03 §8) ---
  - path: "src/billing/**"
    owner: agent:backend
    risk: high                    # para → 🔴 insan okuması
  - path: "src/auth/**"
    owner: agent:backend
    risk: high                    # authz → 🔴
  - path: "src/catalog/**"
    owner: agent:backend
  - path: "src/ui/**"
    owner: agent:frontend
  - path: "design/tokens/**"
    owner: agent:designer

# Unity: sahne ve prefab merge edilemez → exclusive lease (docs/03 §6)
exclusive_lease:
  - path: "Assets/Scenes/**/*.unity"
    rule: "aynı sahneye iki açık PR YASAK; kompozisyonu tek integrator ajan yapar"
  - path: "Assets/Prefabs/Shared/**/*.prefab"
    rule: "paylaşılan prefab; feature kendi prefab'ını yaratır, variant kullanır"

# G2 risk sınıflandırması — path deseni bazlı (docs/05 §3.3)
review_triggers:
  human_required:               # 🔴
    - "**/auth/**"
    - "**/billing/**"
    - "**/payment/**"
    - "**/crypto/**"
    - "db/migrations/**"
    - "**/*pii*"
    - ".github/workflows/**"
    - "CODEOWNERS"
    - "templates/ownership-map.yml"
  summary_required:             # 🟡
    - "**/package.json"
    - "**/pubspec.yaml"
    - "docs/adr/**"
